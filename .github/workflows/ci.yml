name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run tests
        run: npm test

      - name: Build extension zip
        id: package
        run: echo "zip=$(bash scripts/package.sh)" >> "$GITHUB_OUTPUT"

      # Lint exactly what ships: unpack the zip and run Mozilla's add-on linter on it
      - name: Lint with Mozilla web-ext
        run: |
          mkdir -p dist/unpacked
          unzip -q "${{ steps.package.outputs.zip }}" -d dist/unpacked
          npx --yes web-ext@8 lint --source-dir dist/unpacked

      - uses: actions/upload-artifact@v4
        with:
          name: company-highlighter
          path: dist/*.zip
