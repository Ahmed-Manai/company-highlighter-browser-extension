<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Company Highlighter</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body class="popup">
  <label class="row">
    <input type="checkbox" id="enabled">
    <span>Highlighting on</span>
  </label>
  <p id="matches" class="matches"></p>
  <p id="listSize" class="muted"></p>
  <p class="muted small">Shortcut: <kbd>Ctrl+Shift+H</kbd></p>
  <button id="openOptions" class="primary">Edit company list</button>

  <script src="matcher.js"></script>
  <script src="settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
